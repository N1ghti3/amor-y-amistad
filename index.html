<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti, mi amor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Corazones flotando de fondo -->
  <div class="corazones" aria-hidden="true">
    <span style="--x:5%;  --t:9s;  --d:0s;   --s:18px"></span>
    <span style="--x:15%; --t:12s; --d:3s;   --s:12px"></span>
    <span style="--x:25%; --t:10s; --d:6s;   --s:22px"></span>
    <span style="--x:35%; --t:14s; --d:1s;   --s:14px"></span>
    <span style="--x:45%; --t:11s; --d:8s;   --s:20px"></span>
    <span style="--x:55%; --t:13s; --d:4s;   --s:10px"></span>
    <span style="--x:65%; --t:9s;  --d:2s;   --s:24px"></span>
    <span style="--x:75%; --t:12s; --d:7s;   --s:16px"></span>
    <span style="--x:85%; --t:10s; --d:5s;   --s:12px"></span>
    <span style="--x:93%; --t:15s; --d:0.5s; --s:20px"></span>
    <span style="--x:50%; --t:16s; --d:10s;  --s:14px"></span>
    <span style="--x:20%; --t:13s; --d:9s;   --s:18px"></span>
  </div>

  <main>
    <h1>Feliz Día de Amor y Amistad</h1>

    <input type="checkbox" id="abrir" hidden>

    <label for="abrir" class="sobre" title="Ábreme">
      <div class="carta">
        <p class="para">Para: mi amor <span class="corazon">&#9829;&#xFE0E;</span></p>
        <p>
          Gracias por cada sonrisa, cada abrazo y cada momento a tu lado.
          Eres mi persona favorita y mi lugar seguro.
        </p>
        <p class="firma">Te amo muchísimo 💕</p>
      </div>
      <div class="frente"></div>
      <div class="solapa"></div>
      <div class="sello">❤</div>
    </label>

    <p class="pista cerrado">Toca el sobre 💌</p>
    <p class="pista abierto">Toca otra vez para cerrarlo</p>
  </main>

</body>
</html>
